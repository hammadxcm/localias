name: Version Bump

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

jobs:
  version-bump:
    name: Bump ${{ inputs.type }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Credentials are intentionally persisted: the last step pushes the bump commit with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No dependency cache: this job pushes to main (cache-poisoning hardening).
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Create changeset
        run: |
          mkdir -p .changeset
          cat > .changeset/version-bump.md << EOF
          ---
          "localias": ${BUMP}
          "@localias/core": ${BUMP}
          "@localias/infra": ${BUMP}
          "@localias/plugin-sdk": ${BUMP}
          ---

          Version ${BUMP} bump
          EOF
        env:
          BUMP: ${{ inputs.type }}

      - name: Apply changeset version
        run: pnpm changeset version

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version (${BUMP})"
          git push
        env:
          BUMP: ${{ inputs.type }}
